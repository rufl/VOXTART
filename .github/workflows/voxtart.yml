name: VOXTART tests

on:
  push:
    paths:
      - "scripts/addons_core/voxtart/**"
      - "tests/python/voxtart_*.py"
      - "tools/**"
      - "run_voxtart.cmd"
      - ".github/workflows/voxtart.yml"
  pull_request:
    paths:
      - "scripts/addons_core/voxtart/**"
      - "tests/python/voxtart_*.py"
      - "tools/**"
      - "run_voxtart.cmd"
      - ".github/workflows/voxtart.yml"
  workflow_dispatch:

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_LINUX_SHA256: "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168"
  BLENDER_WINDOWS_SHA256: "3849d17a682cba006075aaa3f3597ecb5c9c30ec31035b2e092c53e40679b535"

permissions:
  contents: read

jobs:
  core:
    name: VOXTART core
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Compile VOXTART sources and tests
        run: python -m compileall -q scripts/addons_core/voxtart tests/python tools
      - name: Run deterministic core tests
        run: python tests/python/voxtart_core_test.py
      - name: Measure deterministic core coverage
        env:
          VOXTART_COVERAGE_OUTPUT: ${{ github.workspace }}/voxtart-coverage/core.json
        run: python tests/python/voxtart_coverage.py --all-missing --minimum-percent 100.0
      - name: Upload core coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voxtart-core-coverage
          path: voxtart-coverage/core.json
          if-no-files-found: error
  blender:
    name: Blender ${{ env.BLENDER_VERSION }} native
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download Blender
        run: |
          curl --fail --location --retry 3 \
            "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            --output "${RUNNER_TEMP}/blender.tar.xz"
      - name: Verify Blender Linux checksum
        run: echo "${BLENDER_LINUX_SHA256}  ${RUNNER_TEMP}/blender.tar.xz" | sha256sum --check --status
      - name: Extract Blender
        run: tar -xJf "${RUNNER_TEMP}/blender.tar.xz" -C "${RUNNER_TEMP}"
      - name: Run Blender native suite
        run: "${RUNNER_TEMP}/blender-${BLENDER_VERSION}-linux-x64/blender" --background --python tests/python/voxtart_blender_test.py
      - name: Run headless editor end-to-end matrix
        env:
          VOXTART_PERF_OUTPUT: ${{ github.workspace }}/voxtart-blender-artifacts/performance.json
        run: "${RUNNER_TEMP}/blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python tests/python/voxtart_e2e_blender.py
      - name: Measure Blender-facing coverage
        env:
          VOXTART_COVERAGE_OUTPUT: ${{ github.workspace }}/voxtart-blender-artifacts/coverage.json
        run: "${RUNNER_TEMP}/blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python tests/python/voxtart_blender_coverage.py
      - name: Upload Blender evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voxtart-blender-evidence
          path: voxtart-blender-artifacts
          if-no-files-found: error

  windows:
    name: VOXTART Windows P0
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Download Blender Windows runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "blender.zip"
          $extract = Join-Path $env:RUNNER_TEMP "blender-extract"
          $uri = "https://download.blender.org/release/Blender5.2/blender-$env:BLENDER_VERSION-windows-x64.zip"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $expected = $env:BLENDER_WINDOWS_SHA256.ToLowerInvariant()
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Blender Windows checksum mismatch: expected $expected, got $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $source = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          $runtime = Join-Path $env:GITHUB_WORKSPACE "build\blender-5.2.2\blender-5.2.2-windows-x64"
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          Copy-Item -Path (Join-Path $source.FullName "*") -Destination $runtime -Recurse -Force
          Copy-Item -Path (Join-Path $runtime "blender.exe") -Destination (Join-Path $runtime "blender-core.exe") -Force
      - name: Install MinGW launcher toolchain
        uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2 # v2.29.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          $mingw = "C:\msys64\mingw64\bin"
          $env:Path = "$mingw;$env:Path"
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          where.exe gcc
          where.exe windres
      - name: Build VoxTart launcher
        shell: cmd
        run: call tools\build_voxtart_launcher.cmd
      - name: Prepare Windows evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path (Join-Path $env:GITHUB_WORKSPACE "voxtart-e2e-artifacts") -Force | Out-Null
      - name: Run complete Windows E2E matrix
        shell: cmd
        env:
          VOXTART_E2E_ARTIFACT_DIR: ${{ github.workspace }}\voxtart-e2e-artifacts
          VOXTART_PERF_OUTPUT: ${{ github.workspace }}\voxtart-e2e-artifacts\performance.json
        run: call tools\run_voxtart_e2e.cmd > "voxtart-e2e-artifacts\e2e.log" 2>&1
      - name: Upload Windows E2E artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voxtart-windows-e2e
          path: voxtart-e2e-artifacts
          if-no-files-found: error
